<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map App</title>

    <link rel="stylesheet" href="index.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
</head>
<body>

<div id="container">
    <div id="chat">
        <h3>Navigation Assistant</h3>

        <div id="messages" aria-live="polite"></div>

        <div id="composer">
            <textarea id="messageInput" placeholder="Type a message" rows="2"></textarea>
            <button id="sendBtn" class="send-btn empty" aria-label="Send message">
                <svg viewBox="0 0 24 24">
                    <!-- Circular background -->
                    <circle class="send-circle" cx="12" cy="12" r="11" />
                    <!-- Big triangle (Main body) -->
                    <polygon class="big-triangle" points="7,7 19,12 7,17" />
                    <!-- Mini triangle on its base (Tail/fin) -->
                    <polygon class="mini-triangle" points="7,10 13,12 7,14" />
                </svg>
            </button>
        </div>
    </div>
    <div id="map"></div>
</div>

<!-- Map scripts -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@mapbox/polyline@1.2.1/src/polyline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<!-- Chatbot formatter -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<!-- Main driver -->
<script src="index.js"></script>

</body>
</html>
